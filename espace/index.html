<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<title>Espace RESET | BELIVE</title>
<meta name="description" content="Espace privé du protocole RESET.">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<!-- Pas de start_url dans le manifeste, volontairement : sans lui, l'icône
     d'écran d'accueil s'ouvre sur l'adresse du moment, donc avec la date du client. -->
<link rel="manifest" href="/espace/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="RESET">
<meta name="theme-color" content="#E8ECEF" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0B0E11" media="(prefers-color-scheme:dark)">

<script>
(function(){try{var m=localStorage.getItem('belive-theme');
if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();
</script>

<style>
@font-face{
  font-family:"Outfit";
  src:url("/assets/fonts/Outfit.woff2") format("woff2-variations");
  font-weight:100 900;font-style:normal;font-display:swap;
}

/* ================= Jetons ================= */
:root{
  color-scheme:light dark;
  --page:#E8ECEF; --panel:#FFFFFF; --p2:#F3F5F7; --p3:#DDE3E8;
  --ink:#12171B; --ink-2:#4B5762; --ink-3:#5F6C78;
  --line:#D5DCE2; --filet:#EEF1F3; --anneau:#B7C1C9;
  --ice:#2C6A8A; --ice-2:#DCEBF2; --ice-ink:#1F4F68;
  --dark:#12171B; --on-dark:#E8ECEF; --on-dark-2:#A9B4BD; --dark-line:#4B5762;
  --nav:rgba(255,255,255,.96); --haut:rgba(232,236,239,.92);
  --r-lg:28px; --r-md:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0B0E11; --panel:#14191E; --p2:#1A2026; --p3:#252D35;
    --ink:#EDF2F6; --ink-2:#9CAAB6; --ink-3:#8A98A5;
    --line:#252D35; --filet:#20272E; --anneau:#4B5762;
    --ice:#9DCBE4; --ice-2:#1B2A35; --ice-ink:#BFD9E6;
    --dark:#1F262C; --on-dark:#EEF3F6; --on-dark-2:#9DACB8; --dark-line:#4B5762;
    --nav:rgba(20,25,30,.96); --haut:rgba(11,14,17,.92);
  }
}
:root[data-theme="dark"]{
  --page:#0B0E11; --panel:#14191E; --p2:#1A2026; --p3:#252D35;
  --ink:#EDF2F6; --ink-2:#9CAAB6; --ink-3:#8A98A5;
  --line:#252D35; --filet:#20272E; --anneau:#4B5762;
  --ice:#9DCBE4; --ice-2:#1B2A35; --ice-ink:#BFD9E6;
  --dark:#1F262C; --on-dark:#EEF3F6; --on-dark-2:#9DACB8; --dark-line:#4B5762;
  --nav:rgba(20,25,30,.96); --haut:rgba(11,14,17,.92);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* ================= Base ================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--page);-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;color:var(--ink);
  font-family:"Outfit",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased;
}
a{color:var(--ice);text-decoration:none}
a:hover{color:var(--ink)}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
h1,h2,h3,p{margin:0}
svg{flex:none}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ================= Primitives ================= */
.label{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-size:clamp(34px,7vw,52px);font-weight:600;line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.h1--today{font-size:clamp(36px,8vw,56px)}
.h2{font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.lede{font-size:16px;line-height:1.5;color:var(--ink-2)}
.lede b{color:var(--ink);font-weight:500}
.vue{display:flex;flex-direction:column;gap:20px;animation:fadeIn .25s ease}
.tete{display:flex;flex-direction:column;gap:12px;padding:8px 4px 4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.carte{display:flex;flex-direction:column;gap:18px;padding:24px 22px;border-radius:var(--r-lg);background:var(--panel);min-width:0}
.carte--liste{gap:4px;padding-bottom:14px}
.carte--liste .h2{margin:4px 0 8px}
.entre{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.petit{font-size:13.5px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.pastille{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;color:var(--ink);white-space:nowrap}
.pastille::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pt,var(--anneau))}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--p2);flex:none}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;font-size:13.5px;font-weight:500;
  background:transparent;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
.lien{border:0;background:transparent;padding:0;color:var(--ice);font-size:inherit;font-weight:500;
  text-decoration:underline;text-underline-offset:3px}
.bouton{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:0;
  border-radius:999px;background:var(--ink);color:var(--panel);font-size:16px;font-weight:500}
a.bouton:hover{color:var(--panel)}
.bouton--ligne{min-height:48px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:15px}
.bouton--ligne[aria-pressed="true"]{background:var(--ice-2)}
.bandeau{display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:var(--r-md);background:var(--ice-2)}
.bandeau .label{color:var(--ice-ink)}
.bandeau p{font-size:15.5px;line-height:1.55;text-wrap:pretty}
.bandeau .lien{align-self:flex-start;color:var(--ice-ink);font-size:14px}

/* ================= Ossature ================= */
.marque{display:flex;align-items:center;gap:14px;color:var(--ink)}
.marque-mot{font-size:19px;letter-spacing:.34em;line-height:1;font-weight:300}
.marque-mot b{font-weight:600}
.cote{position:fixed;top:0;left:0;bottom:0;width:256px;padding:28px 18px;display:none;flex-direction:column;
  gap:28px;background:var(--page);border-right:1px solid var(--line);z-index:20}
.cote-tete{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.cote nav{display:flex;flex-direction:column;gap:4px}
.cote nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:0;
  border-radius:999px;font-size:15px;font-weight:500;text-align:left;background:transparent;color:var(--ink-3)}
.cote nav button[aria-current="page"]{background:var(--panel);color:var(--ink)}
.cote-pied{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 6px}
.cote-ou{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.cote-ou strong{font-size:15px;font-weight:500}
.cote-bas{display:flex;gap:8px}
.ecrire{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:46px;border-radius:999px;
  background:var(--panel);color:var(--ink);font-size:14px;font-weight:500;border:1px solid var(--line)}
.theme{display:inline-grid;place-items:center;flex:none;width:46px;height:46px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:0}
/* La pastille du site : demi-pleine = système, vide = clair, pleine = sombre */
.theme-pastille{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;
  background:linear-gradient(to right,transparent 50%,currentColor 50%)}
:root[data-theme="light"] .theme-pastille{background:none}
:root[data-theme="dark"] .theme-pastille{background:currentColor}

.haut{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:var(--haut);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.haut-g{display:flex;align-items:center;gap:10px}
.haut .marque{gap:10px}
.haut .marque-mot{font-size:15px;letter-spacing:.32em}
.haut .label{font-size:.68rem}
.haut-d{display:flex;align-items:center;gap:8px}
.haut .ecrire{flex:none;min-height:40px;padding:0 14px;font-size:13.5px;gap:7px}
.haut .theme{width:40px;height:40px}

main{max-width:1100px;margin:0 auto;padding:4px 16px 116px}

.bas{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--nav);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bas button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;
  border:0;background:transparent;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.bas button span{display:flex;align-items:center;justify-content:center;width:52px;height:30px;
  border-radius:999px;transition:background .15s}
.bas button[aria-current="page"]{color:var(--ink)}
.bas button[aria-current="page"] span{background:var(--ice-2)}

@media (min-width:900px){
  .cote{display:flex}
  .haut,.bas{display:none}
  .principal{padding-left:256px}
  main{padding:44px 44px 72px}
}

/* ================= Aujourd'hui ================= */
.barre{display:flex;gap:4px;margin-top:4px}
.barre i{flex:1;height:6px;border-radius:999px;background:var(--p3)}
.barre i[data-e="fait"]{background:var(--ink)}
.barre i[data-e="ici"]{background:var(--ice)}
.barre i[data-coupe]{margin-left:6px}
.barre-legende{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}

.call{display:flex;flex-direction:column;gap:18px;padding:26px 24px;border-radius:var(--r-lg);
  background:var(--dark);color:var(--on-dark)}
.call .label{color:var(--on-dark-2)}
.call-quand{display:flex;flex-direction:column;gap:6px}
.call-quand strong{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.call-quand span{font-size:15px;color:var(--on-dark-2)}
.call-actes{display:flex;gap:10px;flex-wrap:wrap}
.call-actes a,.call-actes button{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;
  border:0;border-radius:999px;font-size:15px;font-weight:500}
.call-tete{display:flex;justify-content:space-between;align-items:center;gap:12px}
.call .pastille{--pt:#BFD9E6;border-color:var(--dark-line);color:var(--on-dark)}
.call-oui{flex:1 1 auto;background:var(--on-dark);color:var(--dark)}
.call-actes .call-non{flex:0 1 auto;border:1px solid var(--dark-line);background:transparent;color:var(--on-dark)}

.mesures{display:flex;flex-direction:column;gap:16px}
.mesure{display:flex;flex-direction:column;gap:8px}
.mesure-nom{font-size:15px;font-weight:500}
.mesure-echelle{font-size:12.5px;color:var(--ink-3)}
.notes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.notes button{min-height:44px;border-radius:999px;font-size:15px;font-weight:500;
  border:1px solid var(--p2);background:var(--p2);color:var(--ink);transition:background .15s,color .15s}
.notes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}

.proto{gap:6px;padding-bottom:12px}
.proto-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:8px}
.proto-tete>div{display:flex;flex-direction:column;gap:6px}
.compte{font-size:15px;font-weight:500;color:var(--ice)}
.jauge{height:4px;border-radius:999px;background:var(--page);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--ice);transition:width .3s ease}
.groupe{display:flex;flex-direction:column;padding-top:18px}
.groupe-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:4px;min-height:26px}
.groupe-tete small{font-size:12.5px;color:var(--ink-3)}
.groupe-tete .pastille{--pt:var(--ice)}
.acte{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 0;border:0;
  border-bottom:1px solid var(--filet);background:transparent;text-align:left}
.rond{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--anneau);transition:background .15s,border-color .15s;color:var(--panel)}
.rond svg{opacity:0}
.acte[aria-pressed="true"] .rond{background:var(--ink);border-color:var(--ink)}
.acte[aria-pressed="true"] .rond svg{opacity:1}
.acte-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.acte-nom{font-size:15.5px;line-height:1.35}
.acte[aria-pressed="true"] .acte-nom{color:var(--ink-3)}
.acte-note{font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.acte-duree{flex:none;font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.groupe .petit{margin-top:10px}
.proto-pied{margin:14px 0 10px;padding-top:12px}

.depart{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:15px;color:var(--ink-2)}
.depart input{font-size:15px;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--p2);color:var(--ink)}

/* ================= Parcours ================= */
.phases{display:flex;flex-direction:column;gap:12px;min-width:0}
.phase{display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:var(--r-lg)}
.phase[data-e="ici"]{background:var(--panel)}
.phase[data-e="fait"]{background:var(--p2)}
.phase[data-e="fait"] .pastille{--pt:var(--ink)}
.phase[data-e="ici"] .pastille{--pt:var(--ice)}
.phase-tete{display:flex;justify-content:space-between;align-items:center;gap:12px}
.phase-nom{display:flex;flex-direction:column;gap:4px}
.phase-nom h3{font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.phase-nom span{font-size:15px;color:var(--ink-2)}
.phase-detail{display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.55}
.phase-detail p{text-wrap:pretty}
.phase-detail b{font-weight:500}
.sems{display:flex;gap:6px;flex-wrap:wrap}
.sems span{min-width:40px;height:30px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:500;background:var(--p3);color:var(--ink-2)}
.sems span[data-e="fait"]{background:var(--ink);color:var(--panel)}
.sems span[data-e="ici"]{background:var(--ice);color:var(--panel)}
.phase[data-e="avenir"] .sems span{background:transparent;border:1px solid var(--line)}

.ligne{display:flex;align-items:center;gap:14px;min-height:58px;width:100%;padding:6px 0;border:0;
  border-top:1px solid var(--filet);background:transparent;text-align:left}
.ligne-n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;background:var(--p2);color:var(--ink)}
.ligne[data-e="fait"] .ligne-n{background:var(--ink);color:var(--panel)}
.ligne[data-e="proche"] .ligne-n{background:var(--ice-2);color:var(--ice-ink)}
.ligne-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ligne-txt strong{font-size:15px;font-weight:500}
.ligne-txt small{font-size:13px;color:var(--ink-3)}
.ligne-etat{font-size:13px;color:var(--ink-3);white-space:nowrap}
.ligne[data-e="fait"] .ligne-etat,.ligne[data-e="proche"] .ligne-etat,.ligne[data-e="prochain"] .ligne-etat{color:var(--ice)}
.ligne--call{min-height:52px}
.ligne--call .ligne-num{flex:none;width:28px;font-size:13px;font-weight:600}
.ligne--call .ligne-date{flex:1;font-size:15px}
.ligne--call[data-e="fait"]{color:var(--ink-3)}
.plus{align-self:flex-start;margin-top:6px;min-height:40px;padding:0 4px;border:0;background:transparent;
  color:var(--ice);font-size:14px;font-weight:500}
.reglage{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:4px;font-size:14px;color:var(--ink-2)}

/* ================= Journal ================= */
.graphe{display:flex;align-items:flex-end;gap:4px;height:168px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.graphe div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.graphe i{width:100%;max-width:22px;border-radius:999px;background:var(--ink);transition:height .3s ease}
.graphe i[data-e="vide"]{background:var(--p3)}
.graphe i[data-e="ici"]{background:var(--ice)}
.graphe-legende{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:-10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r-md);background:var(--p2)}
.stat small{font-size:12.5px;color:var(--ink-2)}
.stat strong{font-size:28px;font-weight:600;letter-spacing:-.02em}
.stat:nth-child(2) strong{color:var(--ink-3)}
.stat:nth-child(3) strong{color:var(--ice)}
.stat span{font-size:12.5px;color:var(--ink-3)}
.releve{display:flex;align-items:center;gap:6px 12px;min-height:56px;padding:8px 0;border-top:1px solid var(--filet);flex-wrap:wrap}
.releve strong{flex:1 1 140px;font-size:15px;font-weight:500}
.releve span{font-size:13.5px;color:var(--ink-2)}

/* ================= Ressources ================= */
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.kit button{display:flex;flex-direction:column;gap:22px;padding:20px;border:0;border-radius:var(--r-md);
  text-align:left;min-height:150px;background:var(--panel);color:var(--ink)}
.kit small{font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--ink-2)}
.kit strong{margin-top:auto;font-size:18px;font-weight:600;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.kit button:first-child{background:var(--dark);color:var(--on-dark)}
.kit button:first-child small{color:var(--on-dark-2)}
.onglets{align-self:flex-start}
.onglets button{min-height:42px;padding:0 20px;font-size:14.5px}
.onglets button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.famille{gap:4px;padding-bottom:14px}
.famille .entre{padding-bottom:8px}
.famille .res:last-child{border-bottom:0}
.biblio{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));column-gap:28px}
.groupe-docs{display:flex;flex-direction:column;gap:4px}
.groupe-docs+.groupe-docs{margin-top:18px}
.res{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 0;border:0;
  border-bottom:1px solid var(--filet);background:transparent;text-align:left}
.res[data-ferme]{opacity:.55}
.res-type{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--p2);color:var(--ink-2)}
.res[data-type="video"]:not([data-ferme]) .res-type{background:var(--ink);color:var(--panel)}
.res-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.res-txt strong{font-size:15px;font-weight:500;line-height:1.3}
.res-txt small{font-size:13px;color:var(--ink-3)}
.res-vu{font-size:12.5px;color:var(--ice)}
.res svg{color:var(--ink-3)}

/* ================= Feuille ================= */
.feuille{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.voile{position:absolute;inset:0;border:0;background:rgba(18,23,27,.45);animation:fadeIn .2s ease;cursor:default}
.feuille-corps{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;display:flex;
  flex-direction:column;gap:18px;padding:12px 22px calc(24px + env(safe-area-inset-bottom));background:var(--panel);
  box-shadow:0 24px 60px -24px rgba(18,23,27,.35);animation:sheetUp .25s ease;border-radius:28px 28px 0 0}
.poignee{display:flex;justify-content:center;padding-top:2px}
.poignee i{width:40px;height:4px;border-radius:999px;background:var(--line)}
.feuille-tete{display:flex;flex-direction:column;gap:6px}
.feuille-tete h2{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.feuille-txt{font-size:15px;line-height:1.6;text-wrap:pretty}
.verrou{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r-md);background:var(--p2)}
.verrou strong{font-size:15.5px;font-weight:500}
.verrou span{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.lecteur{aspect-ratio:16/9;width:100%;border-radius:var(--r-md);overflow:hidden;background:#12171B}
.lecteur iframe{width:100%;height:100%;border:0;display:block}
.doc{display:flex;flex-direction:column;gap:10px}
.doc .petit{text-align:center}
.jours{display:flex;flex-direction:column;gap:14px}
.jour{display:flex;flex-direction:column;gap:8px}
.jour>span{font-size:14px;font-weight:500}
.creneaux{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.creneaux button{min-height:46px;border-radius:999px;font-size:15px;font-weight:500;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.creneaux button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.bouton[disabled]{background:var(--p2);color:var(--ink-3);cursor:default}
.prepa{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.prepa li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.5;text-wrap:pretty}
.prepa li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--ice)}
@media (min-width:900px){
  .feuille{align-items:center;padding:24px}
  .feuille-corps{border-radius:28px}
}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ========================== Mémoire locale ==========================
   Tout reste dans le navigateur du client : la page n'envoie rien.
   Les coches et les relevés sont rangés par date du calendrier, pas par
   numéro de jour, pour survivre à une date de premier call corrigée. */
const CLE_VU = 'belive-espace-vu';
const CLE_DEPART = 'belive-espace-depart';
const CLE_JOURNAL = 'belive-espace-journal';

function lire(cle, defaut){
  try{ const v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); }
  catch(e){ return defaut; }
}
function ecrire(cle, val){
  try{ localStorage.setItem(cle, JSON.stringify(val)); }catch(e){}
}

let vus = lire(CLE_VU, {}) || {};
let journal = Object.assign({ coches:{}, releves:{} }, lire(CLE_JOURNAL, {}) || {});
let depart = lireDate(String(lire(CLE_DEPART, '') || ''));

/* Le lien personnalisé : belivemethode.com/espace/06-10-2026
   Ce chemin n'existe pas en fichier : GitHub Pages sert la page 404 du site,
   qui renvoie aussitôt ici avec ?j1=06-10-2026. L'ancien format
   ?j1=2026-10-06 marche toujours.
   La date lue dans l'adresse gagne sur celle du navigateur, et s'y enregistre.
   C'est ce qui permet d'envoyer à chaque client un lien déjà calé.

   La date reste ensuite dans l'adresse, et on l'y remet si elle manque.
   Safari efface la mémoire d'un site qu'on n'a pas ouvert depuis sept
   jours, et un favori ou une icône d'écran d'accueil garde l'adresse
   telle qu'elle s'affiche : c'est l'adresse qui doit porter la date. */

/* « 06-10-2026 », « 6-10-2026 » ou « 2026-10-06 » → « 2026-10-06 ».
   Une date qui n'existe pas (31-02-2026) est refusée. */
function lireDate(t){
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t), a, mo, j;
  if(m){ a = +m[1]; mo = +m[2]; j = +m[3]; }
  else {
    m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(t);
    if(!m) return null;
    j = +m[1]; mo = +m[2]; a = +m[3];
  }
  const d = new Date(a, mo - 1, j);
  if(d.getFullYear() !== a || d.getMonth() !== mo - 1 || d.getDate() !== j) return null;
  return a + '-' + String(mo).padStart(2, '0') + '-' + String(j).padStart(2, '0');
}
function versJJMMAAAA(iso){
  const [a, mo, j] = iso.split('-');
  return j + '-' + mo + '-' + a;
}

(function(){
  const j1 = lireDate(new URLSearchParams(location.search).get('j1') || '');
  if(j1){
    depart = j1;
    ecrire(CLE_DEPART, depart);
  }
  majAdresse();
})();

function majAdresse(){
  try{
    const u = new URL(location.href);
    u.searchParams.delete('j1');
    u.pathname = u.pathname.replace(/[^/]*$/, '') + (depart ? versJJMMAAAA(depart) : '');
    if(u.href !== location.href) history.replaceState(history.state, '', u.href);
  }catch(e){}
}

/* ========================== Où en est le client ========================== */
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* La date du jour n du protocole. Midi, pour qu'un changement d'heure

function dateDu(n){

function texteDate(d, o){
  return d.toLocaleDateString('fr-BE', o || { weekday:'long', day:'numeric', month:'long' });
}
function maj(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
function jourCourant(){
  if(!depart) return null;
  const d0 = new Date(depart + 'T00:00:00');
  if(isNaN(d0)) return null;
  const a = new Date(); a.setHours(0, 0, 0, 0);
  return Math.round((a - d0) / 86400000) + 1;
}
/* etat : 'sans' (pas de date), 'avant', 'cours', 'fini'. */
function situation(){
  const j = jourCourant();
  if(j === null) return { etat:'sans', j:null, s:null, phase:null };
  if(j < 1) return { etat:'avant', j:j, s:0, phase:null };
  if(j > 91) return { etat:'fini', j:j, s:14, phase:null };
  const s = Math.ceil(j / 7);
  return { etat:'cours', j:j, s:s, phase:PHASES.find(p => s >= p.s[0] && s <= p.s[1]) };
}
function jourDuCall(n){ return 1 + 7 * (n - 1); }
function ouvert(des, c){
  if(des === 0 || c.etat === 'fini') return true;
  return c.etat === 'cours' && c.s >= des;
}

/* ========================== La journée d'aujourd'hui ==========================
   Tout ce qui suit est repris de la grille des treize semaines (doc 06) et des
   deux guides. Rien n'est extrapolé : une ligne apparaît la semaine où la grille
   la fait entrer, avec la durée de cette semaine-là.
   libre : la pratique ne se fait pas tous les jours, elle se coche mais ne
   compte pas dans le total de la journée.
   ============================================================================ */
function journee(s){
  const lever = [], midi = [], soiree = [], coucher = [];

  lever.push({ id:'lumiere', nom:"Dehors, à la lumière", duree:"10 min",
    note: s >= 2 ? "Dans les trente premières minutes, téléphone hors de portée."
                 : "Dans les trente premières minutes du lever." });

  let am;
  if(s === 1)      am = ["5 min",  "Tu observes ton souffle et tu le comptes."];
  else if(s === 2) am = ["10 min", "Tu observes ton souffle et tu le comptes."];
  else             am = ["10 min", "En pleine conscience."];
  lever.push({ id:'assise-m', nom:"L'assise du matin, avant le café", duree:am[0], note:am[1] });

  if(s >= 6) lever.push({ id:'froid', libre:true, nom:"La douche, froide sur la fin",
    duree: s === 6 ? "30 à 60 s" : "90 à 120 s",
    note:"Les jours sans training. Jamais les deux le même jour." });

  if(s >= 2 && s <= 4) lever.push({ id:'sequence', nom:"La séquence du matin", duree:"2 à 3 min",
    note:"Le bloc 1 seul, délier." });
  else if(s >= 5)      lever.push({ id:'sequence', nom:"La séquence du matin", duree:"10 à 15 min",
    note:"Les trois blocs." });

  if(s >= 2){
    let note;
    if(s <= 4)      note = "La reprise en trois temps, puis trois respirations 4/8. Toujours la même.";
    else if(s <= 7) note = "Trois options, une par état. Tu choisis selon où tu en es.";
    else            note = "L'éventail complet est ouvert.";
    midi.push({ id:'reprise', nom:"À la fin du repas, assis", duree: s <= 4 ? "2 min" : "2 à 5 min", note:note });
    midi.push({ id:'marche-midi', nom:"Juste après, une marche lente", duree: s === 2 ? "5 min" : "10 min",
      note:"Accrochée au repas, jamais à une heure." });
  }

  if(s >= 5){
    soiree.push({ id:'training', libre:true, nom:"Le training", duree: s === 5 ? "25 à 35 min" : "22 à 26 min",
      note: s === 5 ? "Deux séances modérées cette semaine. Allure où la conversation reste possible."
                    : "Deux séances en intervalles cette semaine. Jamais deux jours de suite." });
    soiree.push({ id:'stretching', libre:true, nom:"Le stretching", duree:"25 min",
      note:"Une fois cette semaine, un jour sans training." });
  }

  if(s >= 4) coucher.push({ id:'marche-soir', nom:"Après le repas du soir, une marche lente",
    duree: s <= 7 ? "5 min" : "10 min", note:"" });
  if(s >= 2) coucher.push({ id:'mur', nom:"Allongé, jambes au mur", duree:"5 min",
    note:"Avant l'assise du soir, pas après." });
  if(s >= 3){
    let as;
    if(s === 3)     as = ["5 min",  "Souffle guidé, ratio 4/8."];
    else if(s <= 6) as = ["10 min", "Souffle guidé, ratio 4/8."];
    else            as = ["10 min", "En pleine conscience. Plus de ratio."];
    coucher.push({ id:'assise-s', nom:"L'assise du soir, une demi-heure avant", duree:as[0], note:as[1] });
  }

  return [
    { titre:"Au lever", actes:lever, vide:"", pied:"" },
    { titre:"À midi", actes:midi,
      vide:"L'ancre de midi entre en semaine 2.",
      pied: midi.length ? "Quand la journée déborde, c'est la marche qui saute. Les deux minutes restent." : "" },
    { titre:"En soirée", actes:soiree,
      vide:"La fenêtre reste vide, et c'est voulu. Le training entre en semaine 5.",
      pied: s === 7 ? "Semaine 7 : rien n'augmente." : "" },
    { titre:"Au coucher", actes:coucher,
      vide:"Les jambes au mur entrent en semaine 2.",
      pied: coucher.length ? "Jamais de stretching dans l'heure qui précède." : "" }
  ];
}

/* Les quatre moments sont dans l'ordre de la journée. Ces bornes ne
   servent qu'à savoir lequel mettre en avant : le protocole accroche
   les pratiques à un geste, jamais à une heure. */
function momentActuel(){
  const h = new Date().getHours();
  if(h >= 5 && h < 11) return 0;   // au lever
  if(h >= 11 && h < 16) return 1;  // à midi
  if(h >= 16 && h < 20) return 2;  // en soirée
  return 3;                        // au coucher
}

function barreSemaines(s){

function carteCall(c){
  let n = 1;
  while(n <= 13 && jourDuCall(n) < c.j) n++;
  if(n > 13) return '';
  const reste = jourDuCall(n) - c.j;
  const d = dateDu(jourDuCall(n));
  const quand = reste === 0 ? "Aujourd'hui" : reste === 1 ? 'Demain' : maj(texteDate(d));
  const detail = [HEURE_CALL, reste > 1 ? 'dans ' + reste + ' jours' : '', 'visio', n >= 12 ? 'tu le mènes' : '']
    .filter(Boolean).join(' · ');
  const dem = journal.demande && journal.demande.n === n ? journal.demande : null;
  return '<section class="call">'
    + '<div class="call-tete"><span class="label">Prochain call · ' + n + ' sur 13</span>'
    + (dem ? '<span class="pastille">Demandé : ' + echap(texteDate(dateDu(dem.jour), { weekday:'short', day:'numeric', month:'short' }))
        + ' ' + echap(dem.heure) + '</span>' : '') + '</div>'
    + '<div class="call-quand"><strong>' + echap(quand) + '</strong><span>' + echap(detail) + '</span></div>'
    + '<div class="call-actes">'
    + (VISIO ? '<a class="call-oui" href="' + echap(VISIO) + '" target="_blank" rel="noopener noreferrer">Rejoindre la visio</a>' : '')
    + (reste > 0 ? '<button class="' + (VISIO ? 'call-non' : 'call-oui') + '" type="button" data-act="deplacer" data-n="' + n + '">Déplacer</button>' : '')
    + '</div></section>';
}

function carteReleve(){
  const cle = iso(new Date());

function carteProtocole(c){
  const cle = iso(new Date());

  const moments = journee(c.s);
  const comptes = moments.flatMap(m => m.actes).filter(a => !a.libre);

      + (m.actes.length ? (m.pied ? '<p class="petit">' + echap(m.pied) + '</p>' : '')

    + groupes
    + '<p class="petit proto-pied">Une journée ratée ne se rattrape pas. Manquer est normal. Faire est le résultat.</p>'
    + '</section>';

/* ========================== Parcours ========================== */
function vueParcours(c){
  const phases = PHASES.map(p => {
    const e = c.etat === 'fini' ? 'fait'
      : c.etat !== 'cours' ? 'avenir'
      : c.s > p.s[1] ? 'fait' : c.s < p.s[0] ? 'avenir' : 'ici';
    let sems = '';
    for(let n = p.s[0]; n <= p.s[1]; n++)
      sems += '<span' + (e === 'fait' || (e === 'ici' && n < c.s) ? ' data-e="fait"' : e === 'ici' && n === c.s ? ' data-e="ici"' : '')
        + '>S' + n + '</span>';
    const verrou = e !== 'avenir' ? ''
      : p.n === 1 || !depart ? "S'ouvre au premier call."
      : "S'ouvre au call du " + texteDate(dateDu(jourDuCall(p.s[0])), { day:'numeric', month:'long' }) + '.';
    return '<article class="phase" data-e="' + e + '">'
      + '<div class="phase-tete"><span class="label">Phase ' + p.romain + ' · semaines ' + p.s[0] + ' à ' + p.s[1] + '</span>'
      + '<span class="pastille">' + (e === 'fait' ? 'Terminée' : e === 'ici' ? 'En cours' : 'À venir') + '</span></div>'
      + '<div class="phase-nom"><h3>' + echap(p.nom) + '</h3>'
      + '<span>Le verbe est ' + echap(p.verbe) + '. « ' + echap(p.dit) + ' »</span></div>'
      + (e !== 'avenir' ? '<div class="phase-detail">'
          + '<p><b>Ce qui s\'installe.</b> ' + echap(p.installe) + '</p>'
          + (p.disparait ? '<p><b>Ce qui disparaît.</b> ' + echap(p.disparait) + '</p>' : '')
          + '<p><b>Le creux.</b> ' + echap(p.creux) + '</p></div>' : '')
      + '<div class="sems">' + sems + '</div>'
      + (verrou ? '<span class="petit">' + echap(verrou) + '</span>' : '')
      + '</article>';
  }).join('');

  let cote = '';
  if(depart){
    const j = c.j;
    const sessions = SESSIONS.map(x => {
      const e = x.jour < j ? 'fait' : x.jour - j < 8 ? 'proche' : '';
      return '<button class="ligne" type="button" data-act="session" data-n="' + x.n + '" data-e="' + e + '">'
        + '<span class="ligne-n">' + x.n + '</span>'
        + '<span class="ligne-txt"><strong>' + echap(maj(texteDate(dateDu(x.jour)))) + '</strong>'
        + '<small>Semaine ' + x.semaine + ' · visio · fin de phase ' + PHASES[x.n - 1].romain + '</small></span>'
        + '<span class="ligne-etat">' + (x.jour < j ? 'Faite' : x.jour === j ? "Aujourd'hui" : 'Jour ' + x.jour) + '</span></button>';
    }).join('');

    let prochain = 1;
    while(prochain <= 13 && jourDuCall(prochain) < j) prochain++;
    let calls = [];
    for(let n = 1; n <= 13; n++){
      const e = jourDuCall(n) < j ? 'fait' : n === prochain ? 'prochain' : '';
      calls.push('<div class="ligne ligne--call" data-e="' + e + '">'
        + '<span class="ligne-num">' + String(n).padStart(2, '0') + '</span>'
        + '<span class="ligne-date">' + echap(maj(texteDate(dateDu(jourDuCall(n)), { weekday:'short', day:'numeric', month:'short' }))) + '</span>'
        + '<span class="ligne-etat">' + (e === 'fait' ? 'Fait' : e === 'prochain' ? 'Prochain' : n >= 12 ? 'Tu le mènes' : '') + '</span></div>');
    }
    if(!ecran.tousCalls){
      const p0 = Math.min(prochain, 13);
      calls = calls.slice(Math.max(0, p0 - 3), p0 + 2);
    }
    cote = '<div class="col">'
      + '<section class="carte carte--liste"><span class="label">Les sessions Breathwork · 1 h 30</span>'
      + '<h2 class="h2">La longue ne se fait jamais seul.</h2>' + sessions + '</section>'
      + '<section class="carte carte--liste"><div class="entre"><span class="label">Les calls · un par semaine</span>'
      + '<span class="compte" style="font-size:13px">' + (prochain - 1) + ' / 13</span></div>'
      + '<h2 class="h2">Le ' + echap(texteDate(dateDu(1), { weekday:'long' })) + (HEURE_CALL ? ', ' + echap(HEURE_CALL) : '') + '.</h2>'
      + calls.join('')
      + '<button class="plus" type="button" data-act="calls">' + (ecran.tousCalls ? 'Voir moins' : 'Voir les treize calls') + '</button>'
      + '</section>'
      + '<div class="reglage">' + (ecran.changerDate ? champDate()
          : '<span>Premier call, ' + echap(texteDate(dateDu(1), { day:'numeric', month:'long', year:'numeric' })) + '.</span>'
            + '<button class="lien" type="button" data-act="date">modifier</button>') + '</div>'
      + '</div>';
  } else {
    cote = '<div class="col"><section class="carte"><span class="label">Ton calendrier</span>'
      + '<p class="petit" style="font-size:15px">Les sessions et les treize calls se datent à partir de ton premier call.</p>'
      + champDate() + '</section></div>';
  }

  const sur = c.etat === 'cours' ? ' · jour ' + c.j + ' sur 91' : '';
  return '<div class="vue"><section class="tete"><span class="label">Ton parcours' + sur + '</span>'
    + '<h1 class="h1">Quatre phases. Tu n\'as jamais plus d\'un mois devant toi.</h1></section>'
    + '<div class="cols"><section class="phases">' + phases + '</section>' + cote + '</div></div>';
}

/* ========================== Journal ==========================
   Rien n'est inventé : un jour sans relevé reste un jour sans relevé. */
function valeur(n, k){
  const r = journal.releves[iso(dateDu(n))];
  if(!r) return null;
  const v = [r.matin && r.matin[k], r.soir && r.soir[k]].filter(Boolean);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function moyenne(a, b, k){
  const v = [];
  for(let n = a; n <= b; n++){ const x = valeur(n, k); if(x) v.push(x); }
  return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null;
}
function vueJournal(c){
  const tete = '<section class="tete"><span class="label">Journal de régulation</span>'
    + '<h1 class="h1">Qui relève tient.</h1>';
  if(c.etat === 'sans' || c.etat === 'avant')
    return '<div class="vue">' + tete + '<p class="lede">Matin et soir, quatre-vingt-dix secondes. '
      + 'Le journal commence au premier call.</p></section></div>';

  const jour = c.j;
  const k = ecran.courbe;
  const nom = COURBES.find(x => x[0] === k)[1];
  let releves = 0;
  for(let n = 1; n <= jour; n++) if(journal.releves[iso(dateDu(n))]) releves++;
  const de = Math.max(1, jour - 20);
  let barres = '';
  for(let n = de; n <= jour; n++){
    const v = valeur(n, k);
    barres += '<div title="Jour ' + n + (v ? ' · ' + v.toFixed(1).replace('.', ',') : ' · pas de relevé') + '">'
      + '<i style="height:' + (v ? v / 5 * 100 + '%' : '6px') + '"' + (v ? (n === jour ? ' data-e="ici"' : '') : ' data-e="vide"') + '></i></div>';
  }
  const f = x => x ? x.toFixed(1).replace('.', ',') : '–';
  const stats = [
    [nom + ', 7 derniers jours', f(moyenne(Math.max(1, jour - 6), jour, k)), 'sur 5'],
    [nom + ', semaine 1', f(moyenne(1, Math.min(7, jour), k)), 'ton point de départ'],
    ['Jours relevés', releves + '/' + jour, 'depuis le premier call']
  ].map(s => '<div class="stat"><small>' + echap(s[0]) + '</small><strong>' + s[1] + '</strong><span>' + s[2] + '</span></div>').join('');

  let recents = '';
  for(let n = jour; n >= Math.max(1, jour - 4); n--){
    const r = journal.releves[iso(dateDu(n))] || {};
    const ligne = moment => r[moment] ? maj(moment) + ' · ' + MESURES[moment].filter(m => r[moment][m.k])
      .map(m => (m.k === 'creux' ? 'creux' : m.nom.toLowerCase()) + ' ' + r[moment][m.k]).join(', ') : '';
    const t = [ligne('matin'), ligne('soir')].filter(Boolean);
    recents += '<div class="releve"><strong>' + (n === jour ? "Aujourd'hui"
        : echap(maj(texteDate(dateDu(n), { weekday:'long', day:'numeric', month:'short' })))) + '</strong>'
      + (t.length ? t.map(x => '<span>' + echap(x) + '</span>').join('') : '<span>Pas de relevé</span>') + '</div>';
  }

  return '<div class="vue">' + tete
    + '<p class="lede">Matin et soir, quatre-vingt-dix secondes. Tu as relevé ' + releves + ' jour' + (releves > 1 ? 's' : '')
    + (c.etat === 'fini' ? '' : ' sur ' + jour) + '.</p></section>'
    + '<section class="carte" style="gap:20px"><div class="entre" style="align-items:center;flex-wrap:wrap">'
    + '<span class="label">Les 21 derniers jours</span><div class="seg">'
    + COURBES.map(x => '<button type="button" data-act="courbe" data-v="' + x[0] + '" aria-pressed="' + (x[0] === k) + '">' + x[1] + '</button>').join('')
    + '</div></div>'
    + '<div class="graphe">' + barres + '</div>'
    + '<div class="graphe-legende"><span>' + echap(maj(texteDate(dateDu(de), { day:'numeric', month:'short' }))) + '</span><span>Aujourd\'hui</span></div>'
    + '<div class="stats">' + stats + '</div></section>'
    + '<section class="carte carte--liste"><span class="label" style="padding-bottom:8px">Les derniers relevés</span>' + recents + '</section>'
    + '<p class="petit" style="padding:0 4px">Tes relevés restent sur cet appareil, dans ce navigateur. '
    + 'Le journal papier reste la référence.</p></div>';
}

/* ========================== Ressources ========================== */
function ressources(){
  const docs = DOCS.flatMap(g => g.docs.map(d => ({ cle:'d' + d.n, type:'pdf', genre:'PDF', groupe:g.groupe,
    titre:d.titre, meta:d.meta, des:d.des, url:d.url, pret:!!d.url })));
  /* La clé d'une vidéo est son identifiant YouTube : la coche « vu » la
     suit même si la liste change d'ordre. */
  const videos = PRATIQUES.flatMap(f => f.videos.filter(v => v.id).map(v => ({ cle:'y' + v.id, type:'video',
    genre:f.titre, famille:f.cle, titre:v.titre, meta:v.duree || '', des:v.des || 0, id:v.id, pret:true })));
  return docs.concat(videos);
}
function quandOuvre(des){
  return des <= 1 ? "s'ouvre au premier call" : "s'ouvre en semaine " + des;
}
function ligneRes(r, c){
  const ok = ouvert(r.des, c);
  const meta = !ok ? quandOuvre(r.des) : !r.pret ? 'à venir' : r.meta;
  return '<button class="res" type="button" data-act="res" data-cle="' + echap(r.cle) + '" data-type="' + r.type + '"'
    + (ok && r.pret ? '' : ' data-ferme') + '>'
    + '<span class="res-type">' + (r.type === 'video' ? 'VID' : 'PDF') + '</span>'
    + '<span class="res-txt"><strong>' + echap(r.titre) + '</strong>'
    + (meta ? '<small>' + echap(maj(meta)) + '</small>' : '') + '</span>'
    + (!ok ? CADENAS : vus[r.cle] ? '<span class="res-vu">Vu</span>' : '') + '</button>';
}
/* Deux onglets : les documents à lire, et les pratiques à faire en vidéo. */
function vueRessources(c){
  const tout = ressources();
  const onglets = '<div class="seg onglets">'
    + [['documents', 'Documents'], ['pratiques', 'Pratiques']].map(x => '<button type="button" data-act="onglet" data-v="'
        + x[0] + '" aria-pressed="' + (ecran.onglet === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
  let corps;
  if(ecran.onglet === 'pratiques'){
    corps = PRATIQUES.map(f => {
      const l = tout.filter(r => r.famille === f.cle);
      return '<section class="carte famille"><div class="entre"><h2 class="h2">' + echap(f.titre) + '</h2>'
        + (l.length ? '<span class="petit">' + l.length + ' vidéo' + (l.length > 1 ? 's' : '') + '</span>' : '') + '</div>'
        + (l.length ? l.map(r => ligneRes(r, c)).join('')
            : '<p class="petit" style="font-size:15px">Les vidéos arrivent.</p>')
        + '</section>';
    }).join('');
  } else {
    const docs = tout.filter(r => r.type === 'pdf');
    const kit = KIT.map((k, i) => {
      const r = docs.find(x => x.cle === 'd' + k.n);
      if(!r) return '';
      return '<button type="button" data-act="res" data-cle="' + r.cle + '">'
        + '<small>0' + (i + 1) + ' · ' + echap(ouvert(r.des, c) ? r.meta : 'semaine ' + r.des) + '</small>'
        + '<strong>' + echap(r.titre) + '</strong></button>';
    }).join('');
    corps = '<section style="display:flex;flex-direction:column;gap:12px"><span class="label" style="padding:0 4px">Ton kit</span>'
      + '<div class="kit">' + kit + '</div></section>'
      + '<section class="carte" style="gap:0;padding:22px">'
      + DOCS.map(g => '<div class="groupe-docs"><span class="label">' + echap(g.groupe) + '</span><div class="biblio">'
          + docs.filter(r => r.groupe === g.groupe).map(r => ligneRes(r, c)).join('') + '</div></div>').join('')
      + '</section>';
  }
  const titre = ecran.onglet === 'pratiques' ? 'Respiration, méditation, mouvement.' : 'Phase par phase, jamais tout d\'un coup.';
  return '<div class="vue"><section class="tete"><span class="label">Ressources</span>'
    + '<h1 class="h1">' + titre + '</h1></section>' + onglets + corps + '</div>';
}

/* ========================== Feuilles ========================== */
function feuilleRes(cle, c){
  const r = ressources().find(x => x.cle === cle);
  if(!r) return '';
  const ok = ouvert(r.des, c);
  const kit = KIT.find(k => 'd' + k.n === cle);
  const genre = r.genre;
  let corps;
  if(!ok){
    const quand = r.des <= 1 || !depart ? "S'ouvre au premier call."
      : "S'ouvre en semaine " + r.des + ', au call du ' + texteDate(dateDu(jourDuCall(r.des)), { day:'numeric', month:'long' }) + '.';
    corps = '<div class="verrou"><strong>' + echap(quand) + '</strong>'
      + '<span>Une phase s\'ouvre au call qui la commence, jamais avant. Ce qui arrive trop tôt devient une distraction.</span></div>';
  } else if(!r.pret){
    corps = '<div class="verrou"><strong>À venir.</strong><span>Cette ressource n\'est pas encore en ligne.</span></div>';
  } else if(r.type === 'video'){
    corps = '<div class="lecteur"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(r.id)
      + '?rel=0&modestbranding=1" title="' + echap(r.titre) + '" allow="accelerometer; autoplay; clipboard-write;'
      + ' encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div>';
  } else {
    corps = '<div class="doc"><a class="bouton" href="' + echap(r.url) + '" target="_blank" rel="noopener noreferrer">Ouvrir le PDF</a>'
      + '<span class="petit">S\'ouvre dans un nouvel onglet.</span></div>';
  }
  return '<div class="feuille-tete"><span class="label">' + echap([kit ? 'Ton kit' : genre, ok ? r.meta : ''].filter(Boolean).join(' · ')) + '</span>'
    + '<h2 id="feuille-titre">' + echap(r.titre) + '</h2></div>'
    + corps
    + (kit ? '<p class="feuille-txt">' + echap(kit.texte) + '</p>' : '')
    + (ok && r.pret ? '<button class="bouton bouton--ligne" type="button" data-act="vu" data-cle="' + r.cle
        + '" aria-pressed="' + !!vus[r.cle] + '">' + (vus[r.cle] ? 'Marqué comme vu' : 'Marquer comme vu') + '</button>' : '');
}
function feuilleSession(n){
  const x = SESSIONS.find(s => s.n === n);
  if(!x) return '';
  return '<div class="feuille-tete"><span class="label">Session Breathwork ' + x.n + ' sur 4 · semaine ' + x.semaine + '</span>'
    + '<h2 id="feuille-titre">' + echap(depart ? maj(texteDate(dateDu(x.jour))) + '.' : 'Jour ' + x.jour + '.') + '</h2></div>'
    + '<p class="feuille-txt">' + echap(x.ferme) + '</p>'
    + '<span class="label">Ce que tu prépares</span>'
    + '<ul class="prepa">' + PREPA.map(t => '<li>' + echap(t) + '</li>').join('') + '</ul>';
}
/* Les créneaux : la veille, le jour prévu et les deux jours suivants, pour
   rester dans la même semaine. Confirmer ouvre WhatsApp avec la demande
   écrite ; c'est Tristan qui valide. */
function feuilleCall(n, c){
  const base = jourDuCall(n);
  const jours = [base - 1, base, base + 1, base + 2].filter(j => j > c.j && j <= 91);
  const k = ecran.creneau;
  const msg = k ? 'Bonjour Tristan, je voudrais déplacer le call ' + n + ' du ' + texteDate(dateDu(base))
    + ' au ' + texteDate(dateDu(k.jour)) + ' à ' + k.heure + '.' : '';
  return '<div class="feuille-tete"><span class="label">Déplacer le call ' + n + '</span>'
    + '<h2 id="feuille-titre">Choisis un autre créneau.</h2>'
    + '<p class="petit" style="font-size:14.5px">Même semaine, pour que la phase garde son rythme. '
    + 'Ta demande part à Tristan sur WhatsApp, et il te confirme.</p></div>'
    + '<div class="jours">' + jours.map(j => '<div class="jour"><span>' + echap(maj(texteDate(dateDu(j)))) + '</span>'
        + '<div class="creneaux">' + CRENEAUX.map(h => '<button type="button" data-act="creneau" data-jour="' + j
            + '" data-heure="' + echap(h) + '" aria-pressed="' + !!(k && k.jour === j && k.heure === h) + '">' + echap(h) + '</button>').join('')
        + '</div></div>').join('') + '</div>'
    + (k ? '<a class="bouton" data-act="demande" data-n="' + n + '" href="' + echap(wa(msg)) + '" target="_blank" rel="noopener noreferrer">'
            + 'Confirmer ' + echap(texteDate(dateDu(k.jour), { weekday:'long' })) + ' ' + echap(k.heure) + '</a>'
         : '<button class="bouton" type="button" disabled>Choisis un créneau</button>');
}
let avantFeuille = null;
function rendreFeuille(){
  const f = ecran.feuille;
  const h = !f ? '' : f.type === 'res' ? feuilleRes(f.cle, situation())
    : f.type === 'call' ? feuilleCall(f.n, situation()) : feuilleSession(f.n);
  if(!h){ feuille.innerHTML = ''; document.body.style.overflow = ''; return; }
  feuille.innerHTML = '<div class="feuille"><button class="voile" type="button" data-act="fermer" aria-label="Fermer"></button>'
    + '<div class="feuille-corps" role="dialog" aria-modal="true" aria-labelledby="feuille-titre" tabindex="-1">'
    + '<div class="poignee"><i></i></div>' + h + '</div></div>';
  document.body.style.overflow = 'hidden';
}
function ouvrirFeuille(f){
  avantFeuille = document.activeElement;
  ecran.feuille = f;
  rendreFeuille();
  const c = feuille.querySelector('.feuille-corps');
  if(c) c.focus();
}
function fermerFeuille(){
  if(!ecran.feuille) return;
  ecran.feuille = null;
  rendreFeuille();
  rendre();
  if(avantFeuille && document.contains(avantFeuille)) avantFeuille.focus();
}

/* ========================== Rendu ========================== */
function rendre(){
  const c = situation();
  main.innerHTML = ecran.vue === 'parcours' ? vueParcours(c)
    : ecran.vue === 'journal' ? vueJournal(c)
    : ecran.vue === 'ressources' ? vueRessources(c)
    : vueJour(c);
  document.querySelectorAll('nav [data-vue]').forEach(b => {
    if(b.dataset.vue === ecran.vue) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const ou = document.getElementById('cote-ou');
  ou.hidden = c.etat !== 'cours';
  if(c.etat === 'cours'){
    document.getElementById('cote-semaine').textContent = 'Semaine ' + c.s + ' sur 13';
    document.getElementById('cote-phase').textContent = c.phase.nom;
  }
}

/* L'adresse ne change pas d'une vue à l'autre : chaque changement ajoute une
   étape à l'historique, pour que le bouton retour du téléphone ramène à la
   vue d'avant au lieu de quitter la page. */
function afficherVue(v, remonter){
  ecran.vue = VUES.includes(v) ? v : 'jour';
  rendre();
  if(remonter) window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-vue]');
  if(v){
    if(v.dataset.vue === ecran.vue){ window.scrollTo(0, 0); return; }
    history.pushState({ vue:v.dataset.vue }, '', location.href);
    afficherVue(v.dataset.vue, true);
    return;
  }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const d = b.dataset;
  const jour = iso(new Date());
  switch(d.act){
    case 'moment': ecran.moment = d.v; rendre(); break;
    case 'note': {
      const r = journal.releves[jour] || (journal.releves[jour] = {});
      const m = r[d.moment] || (r[d.moment] = {});
      m[d.k] = +d.v;
      ecrire(CLE_JOURNAL, journal);
      rendre();
      break;
    }
    case 'coche': {
      const k = journal.coches[jour] || (journal.coches[jour] = {});
      k[d.id] = !k[d.id];
      ecrire(CLE_JOURNAL, journal);
      rendre();
      break;
    }
    case 'courbe': ecran.courbe = d.v; rendre(); break;
    case 'calls': ecran.tousCalls = !ecran.tousCalls; rendre(); break;
    case 'date': {
      ecran.changerDate = true; rendre();
      const i = document.getElementById('depart'); if(i) i.focus();
      break;
    }
    case 'onglet': ecran.onglet = d.v; rendre(); break;
    case 'res': ouvrirFeuille({ type:'res', cle:d.cle }); break;
    case 'session': ouvrirFeuille({ type:'session', n:+d.n }); break;
    case 'vu':
      vus[d.cle] = !vus[d.cle];
      ecrire(CLE_VU, vus);
      rendreFeuille();
      break;
    case 'deplacer': ecran.creneau = null; ouvrirFeuille({ type:'call', n:+d.n }); break;
    case 'creneau': {
      ecran.creneau = { jour:+d.jour, heure:d.heure };
      rendreFeuille();
      const b2 = feuille.querySelector('[data-act="demande"]'); if(b2) b2.focus();
      break;
    }
    /* Le lien s'ouvre tout seul dans WhatsApp ; on garde seulement la trace
       de ce qui a été demandé. */
    case 'demande':
      journal.demande = { n:+d.n, jour:ecran.creneau.jour, heure:ecran.creneau.heure };
      ecrire(CLE_JOURNAL, journal);
      fermerFeuille();
      break;
    case 'fermer': fermerFeuille(); break;
  }
  const actif = d.act && main.querySelector('[data-act="' + d.act + '"]'
    + (d.id ? '[data-id="' + d.id + '"]' : '') + (d.k ? '[data-k="' + d.k + '"]' : '') + (d.v ? '[data-v="' + d.v + '"]' : ''));
  if(actif && !ecran.feuille && main.contains(actif) && d.act !== 'date') actif.focus({ preventScroll:true });
});

document.addEventListener('change', e => {
  if(e.target.id !== 'depart') return;
  depart = lireDate(e.target.value) || null;
  ecrire(CLE_DEPART, depart);
  ecran.changerDate = false;
  majAdresse();
  rendre();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') fermerFeuille(); });
window.addEventListener('popstate', e => {
  ecran.feuille = null; rendreFeuille();
  afficherVue(e.state && e.state.vue, true);
});

document.querySelectorAll('[data-wa]').forEach(a => { a.href = wa('Bonjour Tristan, '); });

/* Au rechargement, le navigateur garde la vue où l'on était. */
afficherVue(history.state && history.state.vue, false);

/* Au retour sur l'onglet : le moment a pu changer, et le jour aussi
   si la page est restée ouverte toute la nuit. */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && !ecran.feuille && document.activeElement.tagName !== 'INPUT') rendre();
});

/* ========================== Thème ==========================
   Le même cycle que sur le site, avec la même clé : système, clair, sombre.
   La clé est en texte brut (le site l'écrit ainsi), d'où localStorage direct. */
const MODES = ['system', 'light', 'dark'];
const NOMS = { system:'Thème : système', light:'Thème : clair', dark:'Thème : sombre' };
const COULEURS = { light:'#E8ECEF', dark:'#0B0E11' };
const bThemes = document.querySelectorAll('[data-theme-bouton]');
let mode = 'system';
try{ const m = localStorage.getItem('belive-theme'); if(MODES.includes(m)) mode = m; }catch(e){}

function appliquerTheme(){
  if(mode === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  bThemes.forEach(b => {
    b.setAttribute('aria-label', NOMS[mode] + '. Changer de thème.');
    b.title = NOMS[mode];
  });
  /* La barre du navigateur, et celle du téléphone quand la page est
     ouverte depuis l'écran d'accueil, suivent le thème choisi. */
  document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
    el.content = COULEURS[mode === 'system' ? (el.media.includes('dark') ? 'dark' : 'light') : mode];
  });
}
appliquerTheme();
bThemes.forEach(b => b.addEventListener('click', () => {
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  try{ localStorage.setItem('belive-theme', mode); }catch(e){}
  appliquerTheme();
}));
</script>
</body>
</html>
