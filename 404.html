<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* L'espace privé : /espace/06-10-2026 n'existe pas en fichier, GitHub Pages
   sert donc cette page. On repart tout de suite vers l'espace avec la date,
   avant que quoi que ce soit ne s'affiche ; l'espace remet l'adresse propre. */
(function(){var m=location.pathname.match(/^\/espace\/(\d{1,2}-\d{1,2}-\d{4})\/?$/);
if(m)location.replace('/espace/?j1='+m[1]+location.hash);})();
</script>
<title>Page introuvable | BELIVE</title>

    border:1px solid var(--line);border-radius:999px;padding:.62rem 1.1rem;
    font-size:.9rem;transition:background .2s,color .2s;
  }
  .perdu__liens a:hover{background:var(--panel-2);color:var(--ink)}
</style>
<script>
(function(){try{var m=localStorage.getItem('belive-theme');
if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();
</script>
